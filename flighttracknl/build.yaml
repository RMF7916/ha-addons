# Without this file the Supervisor passes no BUILD_FROM to the Dockerfile and the build stops
# with "base name (${BUILD_FROM}) should not be blank".
#
# Debian rather than Alpine, because the Dockerfile uses apt-get and builds whisper.cpp with
# build-essential and cmake. Home Assistant's base images carry s6-overlay and bashio, so the
# `#!/usr/bin/with-contenv bashio` line in run.sh works.
#
# Trixie and not bookworm, and that is not housekeeping. Bookworm ships glslc from shaderc
# 2023.2 (glslang 11.13, early 2022), and that compiler SEGFAULTS on ggml's matmul shaders --
# measured: dozens of "cannot compile matmul_*" followed by "Segmentation fault", and a build
# that grinds on for an hour before giving up. Trixie ships shaderc 2025.2 (glslang 15.1), and
# the very same whisper.cpp v1.7.4 then builds clean in under two minutes on two cores.
#
# The Vulkan build itself is gone again since 0.5.3 -- it hung the machine, see the changelog --
# but trixie stays. Its layers are built, moving back would mean another full rebuild for nothing,
# and a current Debian is no worse than an old one.
build_from:
  amd64: ghcr.io/home-assistant/amd64-base-debian:trixie
