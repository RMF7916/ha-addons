name: FlightTrackNL
version: "0.3.3"
slug: flighttracknl
description: Flight tracker for Dutch airspace - radar plan view, 3D, weather, and ATC listening via OpenWebRX
url: https://github.com/RMF7916/ha-addons/tree/main/flighttracknl
arch:
  - amd64

# The base image runs s6-overlay, so the Supervisor does not need to wrap its own init around it.
init: false
startup: services
boot: auto

ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: The FlightTrackNL web interface

# Without this line there is no "Open Web UI" button on the add-on page. [HOST] and [PORT:...]
# are filled in by the Supervisor with this machine's address and the port you configured.
webui: "http://[HOST]:[PORT:8090]"

# Ingress: Home Assistant serves the tracker under its own address, behind its own login. That
# makes it reachable from outside through whatever you already use to reach Home Assistant, with
# no second hostname and nothing extra exposed to the public internet.
#
# This used to say ingress was impossible because the front end used absolute paths. That was
# assumed rather than checked, and it was wrong: all fourteen fetch calls are relative
# (api/config, not /api/config), as are style.css and app.js. The one thing that was fixed was
# the websocket to the receiver, and since 1.54.0 that goes through /owrx on this server --
# relative as well.
#
# The port below stays open, so http://<machine>:8090 keeps working at home.
ingress: true
ingress_port: 8090

# addon_config -> /addon_configs/<slug>/ on the machine, reachable over Samba; that is where
# config.json lives, outside the image so an update cannot overwrite it.
# share -> for the speech model and OpenWebRX's two files.
map:
  - addon_config:rw
  - share:rw

# Everything a new installation has to fill in is here: your position, the keys, and every
# external URL. Home Assistant writes these fields to /data/options.json and the server lays them
# over config.json.
#
# AN EMPTY FIELD DOES NOT COUNT. Empty means "not filled in", not "make empty": what is in
# config.json stays, and otherwise the built-in default applies. That way a fresh screen never
# silently overwrites an existing setup, and you only fill in what you want to be different. The
# URLs below do arrive with their values, so you can see where the data comes from and redirect
# it if a source moves.
#
# What does not fit here -- areas, channels, squelch per profile, whisper's fine tuning -- stays
# in config.json. That is too nested for a schema and is better explained where it lives.
options:
  # Alles staat hier met een waarde, ook als die leeg is. Home Assistant tekent het scherm
  # namelijk uit deze lijst: een veld dat hier ontbreekt zie je niet staan, hoe netjes het ook in
  # het schema hieronder beschreven is. Daarom staan de sleutels, de paden en de positie er met
  # een lege waarde in -- zichtbaar en in te vullen, en leeg betekent nog steeds "niet ingevuld".
  lat: ""
  lon: ""
  radius_nm: ""
  home_airport: ""
  trail_minutes: ""
  observer_lat: ""
  observer_lon: ""
  observer_label: ""
  openwebrx_host: ""
  openwebrx_port: ""
  openwebrx_url: ""
  openwebrx_tab_url: ""
  openwebrx_settings_file: ""
  openwebrx_bookmarks_file: ""
  openwebrx_relay: auto
  whisper_enabled: true
  whisper_model: ""
  whisper_threads: 2
  key_openaip: ""
  key_schiphol_id: ""
  key_schiphol_secret: ""
  key_opensky_id: ""
  key_opensky_secret: ""
  photos_contact: ""
  url_positions_1: "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}"
  url_positions_2: "https://opendata.adsb.fi/api/v2/lat/{lat}/lon/{lon}/dist/{radius}"
  url_routes: "https://api.adsbdb.com/v0/callsign/{callsign}"
  url_airframes: "https://s3.opensky-network.org/data-samples/metadata/aircraftDatabase.csv"
  url_logos: "https://images.kiwi.com/airlines/64/{iata}.png"
  url_tiles_night: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"
  url_tiles_day: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"
  url_tiles_sat: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
  url_tiles_ref: "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"
  url_metar: "https://aviationweather.gov/api/data/metar?bbox={box}&format=json"
  url_sigmet: "https://aviationweather.gov/api/data/isigmet?format=json"
  url_rain: "https://api.rainviewer.com/public/weather-maps.json"
  url_rain_tile: "{host}{path}/256/{z}/{x}/{y}/4/1_1.png"
  url_routes_hexdb: "https://hexdb.io/api/v1/route/icao/{callsign}"
  url_photos_hex: "https://api.planespotters.net/pub/photos/hex/{hex}"
  url_photos_reg: "https://api.planespotters.net/pub/photos/reg/{reg}"
  url_ourairports: "https://davidmegginson.github.io/ourairports-data/"
  url_openaip: "https://api.core.openaip.net/api/airspaces"
  url_airport_ehrd: "https://www.rotterdamthehagueairport.nl/wp-json/rtha/v2/flights"
  url_airport_eheh: "https://www.eindhovenairport.nl/api/flights"
  url_teletext: "https://teletekst-data.nos.nl/json/{page}"
  url_schiphol_token: "https://api.auth.schiphol.nl/oauth/token"
  url_schiphol_base: "https://api.schiphol.nl/public/public-flights/v4"
  url_schiphol_audience: "https://api.schiphol.nl/public"
  url_opensky_token: "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"
  url_opensky_base: "https://opensky-network.org/api"
  url_navdata_fix: "https://raw.githubusercontent.com/mcantsin/x-plane-navdata/master/earth_fix.dat"
  url_navdata_nav: "https://raw.githubusercontent.com/mcantsin/x-plane-navdata/master/earth_nav.dat"
  url_navdata_awy: "https://raw.githubusercontent.com/mcantsin/x-plane-navdata/master/earth_awy.dat"

schema:
  # where you are looking
  # Als tekst en niet als getal, want een leeg getalveld bestaat niet in dit schema en juist
  # leeg is hier de manier om te zeggen "laat maar". De server rekent ze zelf om.
  lat: str?
  lon: str?
  radius_nm: str?
  home_airport: str?
  trail_minutes: str?
  observer_lat: str?
  observer_lon: str?
  observer_label: str?

  # the receiver
  openwebrx_host: str?
  openwebrx_port: str?
  openwebrx_url: str?
  openwebrx_tab_url: str?
  openwebrx_settings_file: str?
  openwebrx_bookmarks_file: str?
  openwebrx_relay: list(auto|aan|uit)?

  # listening
  whisper_enabled: bool?
  whisper_model: str?
  whisper_threads: int(1,16)?

  # keys; empty leaves whatever is already there
  key_openaip: password?
  key_schiphol_id: str?
  key_schiphol_secret: password?
  key_opensky_id: str?
  key_opensky_secret: password?
  photos_contact: str?

  # external addresses
  url_positions_1: str?
  url_positions_2: str?
  url_routes: str?
  url_airframes: str?
  url_logos: str?
  url_tiles_night: str?
  url_tiles_day: str?
  url_tiles_sat: str?
  url_tiles_ref: str?
  url_metar: str?
  url_sigmet: str?
  url_rain: str?
  url_rain_tile: str?
  url_routes_hexdb: str?
  url_photos_hex: str?
  url_photos_reg: str?
  url_ourairports: str?
  url_openaip: str?
  url_airport_ehrd: str?
  url_airport_eheh: str?
  url_teletext: str?
  url_schiphol_token: str?
  url_schiphol_base: str?
  url_schiphol_audience: str?
  url_opensky_token: str?
  url_opensky_base: str?
  url_navdata_fix: str?
  url_navdata_nav: str?
  url_navdata_awy: str?
