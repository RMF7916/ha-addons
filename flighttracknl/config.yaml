name: FlightTrackNL
version: "0.2.0"
slug: flighttracknl
description: Vluchtvolger met RadarPlot, 3D-weergave, weer en meeluisteren via OpenWebRX
url: https://github.com/RMF7916/ha-addons/tree/main/flighttracknl
arch:
  - amd64

# De basis-image draait s6-overlay, dus de Supervisor hoeft er geen eigen init omheen te zetten.
init: false
startup: services
boot: auto

ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: De webinterface van FlightTrackNL

# Zonder deze regel staat er geen "Open Web UI"-knop op de add-on-pagina. [HOST] en [PORT:...]
# vult de Supervisor zelf in met het adres van deze machine en de poort die je hebt ingesteld.
# Geen ingress: FlightTrackNL gebruikt absolute paden en een eigen websocket, en dat werkt niet
# achter het ingress-pad van Home Assistant.
webui: "http://[HOST]:[PORT:8090]"

# Ingress: Home Assistant serveert de tracker onder zijn eigen adres, achter zijn eigen login.
# Daarmee is hij van buitenshuis bereikbaar via de tunnel die je al hebt, zonder tweede hostnaam
# en zonder dat er iets extra's aan het publieke net komt te staan.
#
# Eerder stond hier dat dit niet kon omdat de frontend absolute paden zou gebruiken. Dat was
# niet nagekeken en het klopte niet: alle veertien fetch-aanroepen zijn relatief (api/config,
# niet /api/config), net als style.css en app.js. Het enige dat wel vast stond was de websocket
# naar de ontvanger, en die loopt sinds 1.54.0 via /owrx op deze server -- ook relatief.
#
# De poort hieronder blijft gewoon open, dus thuis werkt http://<machine>:8090 zoals altijd.
ingress: true
ingress_port: 8090

# addon_config -> /addon_configs/<slug>/ op de machine, met Samba te bereiken; daar staat
# config.json, buiten het image zodat een update hem niet overschrijft.
# share -> voor het spraakmodel en de twee bestanden van OpenWebRX.
map:
  - addon_config:rw
  - share:rw

# Bewust weinig knoppen hier: alles wat de tracker kan staat in config.json, en dat is te groot
# en te genest om in een schema te wringen. Hieronder alleen wat nodig is om te kunnen starten.
options:
  openwebrx_host: 192.168.3.120
  whisper_threads: 3

schema:
  openwebrx_host: str
  whisper_threads: int(1,16)
