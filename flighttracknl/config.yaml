name: FlightTrackNL
version: "0.3.1"
slug: flighttracknl
description: Flight tracker for Dutch airspace - radar plan view, 3D, weather, and ATC listening via OpenWebRX
url: https://github.com/RMF7916/ha-addons/tree/main/flighttracknl
arch:
  - amd64

# De basis-image draait s6-overlay, dus de Supervisor hoeft er geen eigen init omheen te zetten.
init: false
startup: services
boot: auto

ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: The FlightTrackNL web interface

# Zonder deze regel staat er geen "Open Web UI"-knop op de add-on-pagina. [HOST] en [PORT:...]
# vult de Supervisor zelf in met het adres van deze machine en de poort die je hebt ingesteld.
webui: "http://[HOST]:[PORT:8090]"

# Ingress: Home Assistant serveert de tracker onder zijn eigen adres, achter zijn eigen login.
# Daarmee is hij van buitenshuis bereikbaar via de tunnel die je al hebt, zonder tweede hostnaam
# en zonder dat er iets extra's aan het publieke net komt te staan.
#
# Eerder stond hier dat dit niet kon omdat de frontend absolute paden zou gebruiken. Dat was
# niet nagekeken en het klopte niet: alle veertien fetch-aanroepen zijn relatief (api/config,
# niet /api/config), net als style.css en app.js. Het enige dat wel vast stond was de websocket
# naar de ontvanger, en die loopt sinds 1.54.0 via /owrx op deze server -- ook relatief.
#
# De poort hieronder blijft gewoon open, dus thuis werkt http://<machine>:8090 zoals altijd.
ingress: true
ingress_port: 8090

# addon_config -> /addon_configs/<slug>/ op de machine, met Samba te bereiken; daar staat
# config.json, buiten het image zodat een update hem niet overschrijft.
# share -> voor het spraakmodel en de twee bestanden van OpenWebRX.
map:
  - addon_config:rw
  - share:rw

# Alles wat een nieuwe installatie moet invullen staat hier: je positie, de sleutels en elke
# externe URL. Home Assistant schrijft deze velden naar /data/options.json en de server legt ze
# over config.json heen.
#
# EEN LEEG VELD TELT NIET MEE. Leeg betekent "niet ingevuld", niet "maak leeg": dan blijft staan
# wat in config.json staat, en anders de ingebouwde standaard. Zo overschrijft een vers scherm
# nooit stilzwijgend een bestaande opstelling, en hoef je hier alleen in te vullen wat jij anders
# wilt. De URL's hieronder staan er wel met hun waarde in, zodat je ziet waar de gegevens vandaan
# komen en ze kunt omleggen als een bron verandert.
#
# Wat hier niet in past -- gebieden, kanalen, squelch per profiel, de fijnregeling van whisper --
# blijft in config.json. Dat is te genest voor een schema en staat daar beter uitgelegd.
options:
  whisper_threads: 2
  url_positions_1: "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}"
  url_positions_2: "https://opendata.adsb.fi/api/v2/lat/{lat}/lon/{lon}/dist/{radius}"
  url_routes: "https://api.adsbdb.com/v0/callsign/{callsign}"
  url_airframes: "https://s3.opensky-network.org/data-samples/metadata/aircraftDatabase.csv"
  url_logos: "https://images.kiwi.com/airlines/64/{iata}.png"
  url_tiles_night: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"
  url_tiles_day: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"
  url_tiles_sat: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
  url_tiles_ref: "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"
  url_metar: "https://aviationweather.gov/api/data/metar?bbox={box}&format=json"
  url_sigmet: "https://aviationweather.gov/api/data/isigmet?format=json"
  url_rain: "https://api.rainviewer.com/public/weather-maps.json"
  url_rain_tile: "{host}{path}/256/{z}/{x}/{y}/4/1_1.png"
  url_routes_hexdb: "https://hexdb.io/api/v1/route/icao/{callsign}"
  url_photos_hex: "https://api.planespotters.net/pub/photos/hex/{hex}"
  url_photos_reg: "https://api.planespotters.net/pub/photos/reg/{reg}"
  url_ourairports: "https://davidmegginson.github.io/ourairports-data/"
  url_openaip: "https://api.core.openaip.net/api/airspaces"
  url_airport_ehrd: "https://www.rotterdamthehagueairport.nl/wp-json/rtha/v2/flights"
  url_airport_eheh: "https://www.eindhovenairport.nl/api/flights"
  url_teletext: "https://teletekst-data.nos.nl/json/{page}"
  url_schiphol_token: "https://api.auth.schiphol.nl/oauth/token"
  url_schiphol_base: "https://api.schiphol.nl/public/public-flights/v4"
  url_schiphol_audience: "https://api.schiphol.nl/public"
  url_opensky_token: "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"
  url_opensky_base: "https://opensky-network.org/api"
  url_navdata_fix: "https://raw.githubusercontent.com/mcantsin/x-plane-navdata/master/earth_fix.dat"
  url_navdata_nav: "https://raw.githubusercontent.com/mcantsin/x-plane-navdata/master/earth_nav.dat"
  url_navdata_awy: "https://raw.githubusercontent.com/mcantsin/x-plane-navdata/master/earth_awy.dat"

schema:
  # waar je kijkt
  lat: float(-90,90)?
  lon: float(-180,180)?
  radius_nm: int(10,600)?
  home_airport: str?
  trail_minutes: int(1,180)?
  observer_lat: float(-90,90)?
  observer_lon: float(-180,180)?
  observer_label: str?

  # de ontvanger
  openwebrx_host: str?
  openwebrx_port: port?
  openwebrx_url: str?
  openwebrx_tab_url: str?
  openwebrx_settings_file: str?
  openwebrx_bookmarks_file: str?
  openwebrx_relay: list(auto|aan|uit)?

  # meeluisteren
  whisper_enabled: bool?
  whisper_model: str?
  whisper_threads: int(1,16)?

  # sleutels; leeg laat staan wat er al is
  key_openaip: password?
  key_schiphol_id: str?
  key_schiphol_secret: password?
  key_opensky_id: str?
  key_opensky_secret: password?

  # externe adressen
  url_positions_1: str?
  url_positions_2: str?
  url_routes: str?
  url_airframes: str?
  url_logos: str?
  url_tiles_night: str?
  url_tiles_day: str?
  url_tiles_sat: str?
  url_tiles_ref: str?
  url_metar: str?
  url_sigmet: str?
  url_rain: str?
  url_rain_tile: str?
  url_routes_hexdb: str?
  url_photos_hex: str?
  url_photos_reg: str?
  url_ourairports: str?
  url_openaip: str?
  url_airport_ehrd: str?
  url_airport_eheh: str?
  url_teletext: str?
  url_schiphol_token: str?
  url_schiphol_base: str?
  url_schiphol_audience: str?
  url_opensky_token: str?
  url_opensky_base: str?
  url_navdata_fix: str?
  url_navdata_nav: str?
  url_navdata_awy: str?
