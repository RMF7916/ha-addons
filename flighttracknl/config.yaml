name: FlightTrackNL
version: "0.25.1"
slug: flighttracknl
description: Flight tracker for Dutch airspace - radar plan view, 3D, weather, and ATC listening via OpenWebRX
url: https://github.com/RMF7916/ha-addons/tree/main/flighttracknl
arch:
  - amd64

# The base image runs s6-overlay, so the Supervisor does not need to wrap its own init around it.
init: false
startup: services
boot: auto

ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: The FlightTrackNL web interface

# Without this line there is no "Open Web UI" button on the add-on page. [HOST] and [PORT:...]
# are filled in by the Supervisor with this machine's address and the port you configured.
webui: "http://[HOST]:[PORT:8090]"

# Ingress: Home Assistant serves the tracker under its own address, behind its own login. That
# makes it reachable from outside through whatever you already use to reach Home Assistant, with
# no second hostname and nothing extra exposed to the public internet.
#
# This used to say ingress was impossible because the front end used absolute paths. That was
# assumed rather than checked, and it was wrong: all fourteen fetch calls are relative
# (api/config, not /api/config), as are style.css and app.js. The one thing that was fixed was
# the websocket to the receiver, and since 1.54.0 that goes through /owrx on this server --
# relative as well.
#
# The port below stays open, so http://<machine>:8090 keeps working at home.
ingress: true
ingress_port: 8090

# Het pictogram in de zijbalk van Home Assistant. icon.png en logo.png gelden alleen voor de
# winkelpagina van de add-on; de zijbalk kijkt uitsluitend naar panel_icon, en zonder dit veld
# staat er een puzzelstukje. Het moet een Material Design Icon-naam zijn -- een eigen afbeelding
# kan daar niet, die vraagt een custom panel of de custom-icons-integratie.
panel_icon: mdi:radar
panel_title: FlightTrackNL

# addon_config -> /addon_configs/<slug>/ on the machine, reachable over Samba; that is where
# config.json lives, outside the image so an update cannot overwrite it.
# share -> for the speech model and OpenWebRX's two files.
map:
  - addon_config:rw
  - share:rw

# Everything a new installation has to fill in is here: your position, the keys, and every
# external URL. Home Assistant writes these fields to /data/options.json and the server lays them
# over config.json.
#
# AN EMPTY FIELD DOES NOT COUNT. Empty means "not filled in", not "make empty": what is in
# config.json stays, and otherwise the built-in default applies. That way a fresh screen never
# silently overwrites an existing setup, and you only fill in what you want to be different. The
# URLs below do arrive with their values, so you can see where the data comes from and redirect
# it if a source moves.
#
# What does not fit here -- areas, channels, squelch per profile, whisper's fine tuning -- stays
# in config.json. That is too nested for a schema and is better explained where it lives.
options:
  # Every field carries a value here, empty where it has none. Home Assistant draws the screen
  # from THIS list, not from the schema below: a field missing here does not appear at all, no
  # matter how carefully the schema describes it.
  #
  # And empty they stay, including the URLs. Pre-filling them with the address in use looked
  # helpful, but a filled field is a value the screen imposes on every start -- and that silently
  # replaced a source somebody had set in config.json. Empty means "not filled in", and that only
  # holds if nothing is filled in for you. The addresses in use are listed in DOCS.md, where you
  # can copy them without them imposing anything.
  # Listening. Off by default: most people run this without an SDR, and a receiver you do not
  # have should not leave a player, a channel list and frequency buttons all over the screen.
  # Switching it off wipes nothing -- config.json, the recordings, the learned words and the
  # channel choices all stay where they are, so switching it back on brings everything back.
  listening: false

  lat: ""
  lon: ""
  radius_nm: ""
  home_airport: ""
  trail_minutes: ""
  # Where YOU are. This one moves: at a spotting place you stand somewhere else than at home.
  # Leave it empty and the browser is asked, or you place yourself on the map by long-pressing it.
  observer_lat: ""
  observer_lon: ""
  observer_label: ""
  # Where the receiving ANTENNA stands. A fixed installation that does not travel with you, and
  # the only one of the two that says anything about range. Leave the coordinates empty and the
  # server asks OpenWebRX for its own position; a receiver knows where it stands. They stay empty
  # here on purpose: a value filled in at this level is imposed on every installation.
  # antenne_agl_m is the height of the antenna above the ground, which sets the radio horizon.
  # antenne_zicht_deg is de richting waar het zicht vanaf die plek vrij is -- de kant van de tuin,
  # het balkon of het dakraam -- in graden. Er komt dan een pijl bij de mast te staan.
  # antenne_zicht_ref zegt waar dat getal vandaan komt: kaart (rechtwijzend) of kompas
  # (magnetisch, waarna de variatie ter plaatse erbij wordt opgeteld). auto laat config.json staan.
  # Dat is hier de rol die de lege tekst bij de andere velden speelt: een keuzelijst mag niet leeg
  # zijn, want Home Assistant keurt dan het hele scherm af en niet alleen dit veld.
  antenne_lat: ""
  antenne_lon: ""
  antenne_label: ""
  antenne_agl_m: ""
  antenne_zicht_deg: ""
  antenne_zicht_ref: auto
  openwebrx_host: ""
  openwebrx_port: ""
  openwebrx_url: ""
  openwebrx_tab_url: ""
  openwebrx_settings_file: ""
  openwebrx_bookmarks_file: ""
  openwebrx_relay: auto
  whisper_enabled: true
  whisper_model: ""
  whisper_threads: 2
  key_openaip: ""
  key_carto: ""
  key_schiphol_id: ""
  key_schiphol_secret: ""
  key_opensky_id: ""
  key_opensky_secret: ""
  photos_contact: ""
  url_positions_1: ""
  url_positions_2: ""
  url_routes: ""
  url_airframes: ""
  url_logos: ""
  url_tiles_night: ""
  url_tiles_day: ""
  url_tiles_sat: ""
  url_tiles_radar: ""
  url_tiles_ref: ""
  url_metar: ""
  url_sigmet: ""
  url_rain: ""
  url_rain_tile: ""
  url_routes_hexdb: ""
  url_photos_hex: ""
  url_photos_reg: ""
  url_ourairports: ""
  url_openaip: ""
  url_airport_ehrd: ""
  url_airport_eheh: ""
  url_teletext: ""
  url_schiphol_token: ""
  url_schiphol_base: ""
  url_schiphol_audience: ""
  url_opensky_token: ""
  url_opensky_base: ""
  url_navdata_fix: ""
  url_navdata_nav: ""
  url_navdata_awy: ""

schema:
  # listening on or off; a switch is never empty, so this one always wins over config.json --
  # which is the point: otherwise there would be no way to turn it off.
  listening: bool

  # where you are looking
  # Als tekst en niet als getal, want een leeg getalveld bestaat niet in dit schema en juist
  # leeg is hier de manier om te zeggen "laat maar". De server rekent ze zelf om.
  lat: str?
  lon: str?
  radius_nm: str?
  home_airport: str?
  trail_minutes: str?
  observer_lat: str?
  observer_lon: str?
  observer_label: str?
  antenne_lat: str?
  antenne_lon: str?
  antenne_label: str?
  antenne_agl_m: str?
  antenne_zicht_deg: str?
  antenne_zicht_ref: list(auto|kaart|kompas)?

  # the receiver
  openwebrx_host: str?
  openwebrx_port: str?
  openwebrx_url: str?
  openwebrx_tab_url: str?
  openwebrx_settings_file: str?
  openwebrx_bookmarks_file: str?
  openwebrx_relay: list(auto|aan|uit)?

  # listening
  whisper_enabled: bool?
  whisper_model: str?
  whisper_threads: int(1,16)?

  # keys; empty leaves whatever is already there
  key_openaip: password?
  key_carto: password?
  key_schiphol_id: str?
  key_schiphol_secret: password?
  key_opensky_id: str?
  key_opensky_secret: password?
  photos_contact: str?

  # external addresses
  url_positions_1: str?
  url_positions_2: str?
  url_routes: str?
  url_airframes: str?
  url_logos: str?
  url_tiles_night: str?
  url_tiles_day: str?
  url_tiles_sat: str?
  url_tiles_radar: str?
  url_tiles_ref: str?
  url_metar: str?
  url_sigmet: str?
  url_rain: str?
  url_rain_tile: str?
  url_routes_hexdb: str?
  url_photos_hex: str?
  url_photos_reg: str?
  url_ourairports: str?
  url_openaip: str?
  url_airport_ehrd: str?
  url_airport_eheh: str?
  url_teletext: str?
  url_schiphol_token: str?
  url_schiphol_base: str?
  url_schiphol_audience: str?
  url_opensky_token: str?
  url_opensky_base: str?
  url_navdata_fix: str?
  url_navdata_nav: str?
  url_navdata_awy: str?
